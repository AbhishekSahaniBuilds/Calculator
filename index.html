<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Calculator</title>
    <link rel="stylesheet" href="asserts/CSS/style.css" />
    <link rel="icon" href="asserts/Picture/icon.png" />
  </head>
  <body>
    <p id="heading">Calculator</p>
    <div class="calculator">
      <input class="display" value="" disabled />
      <div class="buttons">
        <div class="row">
          <button class="btn" id="bt7">7</button>
          <button class="btn" id="bt8">8</button>
          <button class="btn" id="bt9">9</button>
          <button class="btn" id="btpls">+</button>
          <button class="btn" id="btc">C</button>
        </div>
        <div class="row">
          <button class="btn" id="bt4">4</button>
          <button class="btn" id="bt5">5</button>
          <button class="btn" id="bt6">6</button>
          <button class="btn" id="btmns">-</button>
          <button class="btn" id="btopn">(</button>
        </div>
        <div class="row">
          <button class="btn" id="bt1">1</button>
          <button class="btn" id="bt2">2</button>
          <button class="btn" id="bt3">3</button>
          <button class="btn" id="btmul">*</button>
          <button class="btn" id="btcls">)</button>
        </div>
        <div class="row">
          <button class="btn" id="bt0">0</button>
          <button class="btn" id="btdot">.</button>
          <button class="btn" id="btdiv">/</button>
          <button class="btn" id="bteql">=</button>
        </div>
      </div>
    </div>
    <script src="asserts/JavaScript/app.js"></script>
  </body>
</html>
